<body>

    <header>
        <nav class="navbar">

            <div class="logo-container">

                <img src="nasa-logo.svg" class="logo" alt="Logo da NASA">

                <h2>NASA</h2>

            </div>

            <ul class="menu">

    <div class="formulario_container">
        <div class="container_logo_formulario">
            <img src="nasa-logo.svg"  class="logo_contato" alt="Logo da NASA">
        </div>
        <br>
        <br>
        <br>
        <div>
            <form action="home.html">
                
                <div class="container_formulario">
                    <label for="nome">Nome Completo:</label>
                </div>
                <br>
                <div class="container_formulario">
                    <input class="tamanho_input" type="text" placeholder="Fulano da silva" required>
                </div>

                <br>

                <div class="container_formulario">
                    <label  for="email">Email:</label>
                </div>

                <br>

                <div class="container_formulario">

                    <input class="tamanho_input" type="email" placeholder="Exemplo@gmail.com" required>

                </div>

                <br>

                <div class="container_formulario">
                    <label for="Telefone">Telefone:</label>
                </div>

                <br>

                <div class="container_formulario">
                    <input  class="tamanho_input" placeholder="(00)00000-0000"  type="text" required>
                </div>
                <br>
                <br>
                <br>
                <br>
                <div class="div_redefinir">
                    <input type="reset" value="Redefinir">
                </div>

                <div class="div_enviar">
                    <input type="submit" value="Enviar">
                </div> 


            </form>
        </div>
    </div>
